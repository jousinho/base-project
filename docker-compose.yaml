services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./symfony:/var/www/project
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - symfony-network

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    volumes:
      - ./symfony:/var/www/project
    environment:
      - APP_ENV=dev
    networks:
      - symfony-network

  php-cli:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    volumes:
      - ./symfony:/var/www/project
    environment:
      - APP_ENV=dev
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - symfony-network
    entrypoint: ['/bin/sh', '-c']
    command: ['tail -f /dev/null'] # Comando que mantiene el contenedor corriendo

networks:
  symfony-network:
    driver: bridge